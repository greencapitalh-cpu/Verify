services:
  - type: web
    name: verify-udochain
    env: node
    plan: starter
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080

      # 🟦 MongoDB Validate — Lectura de evidencias (solo lectura)
      - key: MONGO_URI_VALIDATE
        sync: false

      # 🟨 MongoDB Verify — Logs y registros de verificaciones
      - key: MONGO_URI_VERIFY
        sync: false

      # 🔑 Keyfile JSON para conexión segura a Aereware
      - key: AEREWARE_KEYFILE_JSON
        sync: false

      # 🌍 Configuración opcional del gateway Aereware
      - key: AEREWARE_GATEWAY_HOST
        value: arweave.net
      - key: AEREWARE_GATEWAY_PORT
        value: "443"
      - key: AEREWARE_GATEWAY_PROTOCOL
        value: https
