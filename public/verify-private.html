<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UDoChain Private Verification</title>

<link rel="icon" href="logo-udochain.png" />
<link rel="stylesheet" href="styles.css" />

<style>
body {
  font-family: "Inter", sans-serif;
  background: #f9fafb;
  color: #1e293b;
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: white;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo { height: 36px; }

.header-title {
  font-weight: 700;
  font-size: 1.25rem;
  color: #5b2e90;
}

.back-link {
  text-decoration: none;
  background: #f1f5f9;
  padding: 6px 14px;
  border-radius: 8px;
  color: #475569;
  font-size: 0.9rem;
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 2rem 1rem;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 2rem;
  max-width: 620px;
  width: 100%;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}

.badge {
  margin: 0 auto 1rem;
  padding: 6px 14px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 0.85rem;
  width: fit-content;
}

.badge.verified { background: #ede9fe; color: #5b2e90; }
.badge.unverified { background: #fee2e2; color: #991b1b; }

.field {
  margin-bottom: 1rem;
  text-align: center;
}

.label {
  font-weight: 600;
  display: block;
  margin-bottom: 4px;
}

.value {
  word-break: break-all;
}

.download-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  margin-top: 1.5rem;
  background: #5b2e90;
  color: white;
}

.home-btn {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  margin-top: 1.2rem;
  background: #475569;
  color: white;
}

footer {
  text-align: center;
  padding: 1rem;
  font-size: 0.85rem;
  color: #6b7280;
  border-top: 1px solid #e2e8f0;
  background: white;
}
</style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="logo-udochain.png" class="logo" />
    <span class="header-title">UDoChain Verify</span>
  </div>
  <a href="index.html" class="back-link">Verify Home</a>
</header>

<main>
  <div class="card">

    <div id="badge"></div>
    <div id="details"></div>
    <div id="downloads"></div>

    <button class="home-btn" onclick="window.location.href='index.html'">
      Back to Verify Home
    </button>

  </div>
</main>

<footer>
  <p>You do. We validate.</p>
  <p>© 2026 UDoChain — All rights reserved.</p>
</footer>

<script src="verify-private.js"></script>

</body>
</html>
