<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UDoChain Private Verification</title>

<link rel="icon" href="logo-udochain.png" />

<style>
body{
  font-family:"Inter",sans-serif;
  background:#f9fafb;
  color:#1e293b;
  margin:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* HEADER */
header{
  background:#ffffff;
  border-bottom:1px solid #e2e8f0;
  padding:1rem 1.5rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{height:36px;}

.header-title{
  font-weight:700;
  font-size:1.2rem;
  color:#5b2e90;
}

.dashboard-btn{
  background:#5b2e90;
  color:white;
  text-decoration:none;
  padding:8px 18px;
  border-radius:10px;
  font-weight:600;
  font-size:0.9rem;
  transition:all .2s ease;
}

.dashboard-btn:hover{
  background:#4a2476;
}

/* MAIN */
main{
  flex:1;
  display:flex;
  justify-content:center;
  padding:3rem 1rem;
}

.card{
  background:white;
  border-radius:18px;
  padding:2.5rem;
  max-width:700px;
  width:100%;
  box-shadow:0 6px 20px rgba(0,0,0,0.06);
}

.section{
  margin-bottom:2rem;
}

.section-title{
  font-weight:600;
  font-size:1rem;
  color:#5b2e90;
  margin-bottom:1rem;
  border-bottom:1px solid #e2e8f0;
  padding-bottom:.5rem;
}

.badge{
  display:inline-block;
  padding:6px 14px;
  border-radius:12px;
  font-size:0.8rem;
  font-weight:600;
  margin-bottom:1.5rem;
}

.badge.verified{
  background:#ede9fe;
  color:#5b2e90;
}

.badge.unverified{
  background:#fee2e2;
  color:#991b1b;
}

.field{
  margin-bottom:1rem;
}

.label{
  font-size:0.8rem;
  color:#64748b;
  display:block;
  margin-bottom:2px;
}

.value{
  font-size:0.95rem;
  font-weight:500;
  word-break:break-all;
}

.file-item{
  margin-bottom:.5rem;
  font-size:.9rem;
}

.file-hash{
  font-size:.75rem;
  color:#64748b;
}

.download-btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-weight:600;
  cursor:pointer;
  background:#5b2e90;
  color:white;
  font-size:.95rem;
  transition:all .2s ease;
}

.download-btn:hover{
  background:#4a2476;
}

footer{
  text-align:center;
  padding:1rem;
  font-size:.85rem;
  color:#6b7280;
  border-top:1px solid #e2e8f0;
  background:white;
}
</style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="logo-udochain.png" class="logo"/>
    <span class="header-title">UDoChain Verify</span>
  </div>
  <a href="https://app.udochain.com/dashboard" class="dashboard-btn">
    Go to Dashboard
  </a>
</header>

<main>
  <div class="card">
    <div id="badge"></div>

    <div class="section">
      <div class="section-title">Evidence Information</div>
      <div id="details">Loading validation data...</div>
    </div>

    <div class="section">
      <div class="section-title">Files</div>
      <div id="downloads"></div>
    </div>
  </div>
</main>

<footer>
  <p>You do. We validate.</p>
  <p>© 2025 UDoChain — All rights reserved.</p>
</footer>

<script src="verify-private.js"></script>
</body>
</html>
