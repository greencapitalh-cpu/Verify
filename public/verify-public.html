<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UDoChain Verification</title>
    <link rel="icon" href="logo-udochain.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f9fafb;
        color: #1e293b;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        background: white;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e2e8f0;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        height: 36px;
      }

      .header-title {
        font-weight: 700;
        font-size: 1.25rem;
        color: #184b8c;
      }

      .back-link {
        font-size: 0.95rem;
        color: #475569;
        text-decoration: none;
        background: #f1f5f9;
        padding: 6px 14px;
        border-radius: 8px;
        transition: all 0.25s;
      }

      .back-link:hover {
        background: #e2e8f0;
        color: #184b8c;
      }

      main {
        flex: 1;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        padding: 2rem;
        max-width: 600px;
        width: 100%;
      }

      h2 {
        text-align: center;
        color: #184b8c;
        margin-bottom: 1rem;
      }

      .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
      }

      .field {
        margin-bottom: 0.8rem;
      }

      .label {
        font-weight: 600;
        color: #475569;
      }

      .value {
        color: #1e293b;
        word-break: break-all;
      }

      .divider {
        border-top: 1px solid #e2e8f0;
        margin: 1.5rem 0;
      }

      .drop-zone {
        border: 2px dashed #cbd5e1;
        border-radius: 10px;
        padding: 40px;
        background: white;
        text-align: center;
        color: #64748b;
        cursor: pointer;
        transition: 0.3s;
      }

      .drop-zone.dragover {
        border-color: #184b8c;
        background: #eff6ff;
      }

      #status {
        text-align: center;
        margin-top: 1rem;
        font-weight: 600;
      }

      .ok {
        color: #14532d;
      }

      .fail {
        color: #b91c1c;
      }

      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 1rem;
        text-align: center;
      }

      .badge.verified {
        background: #dcfce7;
        color: #14532d;
      }

      .badge.unverified {
        background: #fee2e2;
        color: #991b1b;
      }

      footer {
        border-top: 1px solid #e2e8f0;
        background: white;
        padding: 1rem;
        font-size: 0.85rem;
        color: #6b7280;
        text-align: center;
      }

      @media (max-width: 600px) {
        .card {
          padding: 1.5rem;
        }
        h2 {
          font-size: 1.3rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <img src="logo-udochain.png" alt="UDoChain Logo" class="logo" />
        <span class="header-title notranslate" translate="no">UDoChain Verify</span>
      </div>
      <a href="https://validate.udochain.com" class="back-link">Back</a>
    </header>

    <main>
      <div class="card">
        <div id="badge"></div>
        <h2>Validation Details</h2>
        <p class="subtitle">Check authenticity of a document registered on blockchain.</p>

        <div id="details">Loading validation data...</div>

        <div class="divider"></div>

        <h2>Verify a File</h2>
        <p class="subtitle">Upload the original file to confirm its authenticity.</p>

        <div id="dropZone" class="drop-zone">
          Drop or click to upload your file.
        </div>

        <div id="status"></div>
      </div>
    </main>

    <footer>
      <p class="notranslate" translate="no">You do. We validate.</p>
      <p>© 2025 UDoChain — All rights reserved.</p>
    </footer>

    <script src="verify-public.js"></script>
    <script src="script-translate.js"></script>
  </body>
</html>
