<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UDoChain Verify</title>
    <link rel="icon" href="logo-udochain.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <img src="logo-udochain.png" class="logo" alt="UDoChain" />
        <h2 class="notranslate" translate="no">UDoChain Verify</h2>
      </div>
      <nav>
        <a href="https://wapp.udochain.com" class="nav-link">← Back to Wapp</a>
      </nav>
    </header>

    <!-- MAIN -->
    <main class="container">
      <h2>Verify a Document</h2>
      <p class="subtitle">Scan a QR code or enter a document hash to check authenticity.</p>

      <div class="verify-options">
        <!-- Hash Search -->
        <div class="verify-block">
          <input type="text" id="hashInput" placeholder="Enter or paste document hash..." />
          <button class="btn-validate" id="searchBtn">Search</button>
        </div>

        <!-- QR Options -->
        <div class="qr-section">
          <button class="btn-validate" id="scanGallery">Import from Gallery</button>
          <button class="btn-validate" id="scanCamera">Scan with Camera</button>
        </div>
      </div>

      <div id="result" class="status"></div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <p class="notranslate" translate="no">You do. We validate.</p>
      <p>© 2025 UDoChain — All rights reserved.</p>
    </footer>

    <script src="verify.js"></script>
  </body>
</html>
