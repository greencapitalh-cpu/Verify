<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UDoChain Verify</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <img src="logo-udochain.png" alt="UDoChain" class="logo" />
    <h1>UDoChain Verify</h1>
  </header>

  <main class="container">
    <h2>Verify Evidence</h2>
    <input type="file" id="fileInput" />
    <input type="text" id="hashInput" placeholder="Enter hash or TX" />
    <button id="verifyBtn">Verify</button>
    <div id="status" class="status"></div>
  </main>

  <footer>
    <p>You do. We validate.</p>
  </footer>

  <script src="verify.js"></script>
  <script src="script-translate.js"></script>
</body>
</html>
