<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UDoChain Verify</title>
    <link rel="icon" href="logo-udochain.png" />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f9fafb;
        color: #1e293b;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e2e8f0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        height: 36px;
      }

      .header-title {
        font-weight: 700;
        font-size: 1.25rem;
        color: #184b8c;
      }

      .back-link {
        font-size: 0.95rem;
        color: #475569;
        text-decoration: none;
        background: #f1f5f9;
        padding: 6px 14px;
        border-radius: 8px;
        transition: all 0.25s;
      }

      .back-link:hover {
        background: #e2e8f0;
        color: #184b8c;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .verify-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        padding: 2rem;
        max-width: 460px;
        width: 100%;
        text-align: center;
      }

      h2 {
        color: #184b8c;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: #6b7a90;
        font-size: 0.95rem;
        margin-bottom: 1.8rem;
      }

      .hash-box {
        display: flex;
        align-items: center;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 1.4rem;
      }

      .hash-box input {
        flex: 1;
        border: none;
        outline: none;
        padding: 12px;
        font-size: 0.95rem;
        background: #f8fafc;
      }

      .hash-box button {
        background: #184b8c;
        color: white;
        border: none;
        padding: 12px 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }

      .hash-box button:hover {
        background: #153d72;
      }

      .qr-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 1rem;
      }

      .qr-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: 12px;
        border: none;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        padding: 14px;
        transition: all 0.25s ease;
        width: 100%;
      }

      .qr-btn img {
        width: 20px;
        height: 20px;
      }

      .qr-btn.gallery {
        background: #e9f8ed;
        color: #14532d;
      }

      .qr-btn.gallery:hover {
        background: #d4edda;
      }

      .qr-btn.camera {
        background: #edf2f7;
        color: #1e3a8a;
      }

      .qr-btn.camera:hover {
        background: #e0e7ff;
      }

      #qr-preview {
        display: none;
        margin-top: 1.5rem;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }

      /* === Overlay del escáner animado === */
      #qr-overlay {
        position: absolute;
        inset: 0;
        border: 2px solid rgba(24, 75, 140, 0.5);
        border-radius: 8px;
        pointer-events: none;
        overflow: hidden;
      }

      #scanner-line {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: #184b8c;
        animation: scanLine 2s linear infinite;
      }

      @keyframes scanLine {
        0% {
          top: 0%;
          opacity: 0.8;
        }
        50% {
          opacity: 1;
        }
        100% {
          top: 100%;
          opacity: 0.8;
        }
      }

      footer {
        text-align: center;
        border-top: 1px solid #e2e8f0;
        background: white;
        color: #6b7280;
        padding: 1rem;
        font-size: 0.85rem;
      }

      #result {
        margin-top: 1.2rem;
        color: #184b8c;
        font-weight: 600;
      }
    </style>
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' https: blob: data: 'unsafe-inline' 'unsafe-eval';">
  </head>

  <body>
    <header>
      <div class="header-left">
        <img src="logo-udochain.png" alt="UDoChain Logo" class="logo" />
        <span class="header-title notranslate" translate="no">UDoChain Verify</span>
      </div>
      <a href="https://wapp.udochain.com" class="back-link">Back</a>
    </header>

    <main>
      <section class="verify-card">
        <h2>Verify Document</h2>
        <p class="subtitle">Scan a QR code, upload one, or enter a document hash to verify authenticity.</p>

        <div class="hash-box">
          <input type="text" id="hashInput" placeholder="Paste or enter document hash..." />
          <button id="verifyBtn">Search</button>
        </div>

        <div class="qr-actions">
          <button class="qr-btn gallery" id="scanGallery">
            <img src="icon-gallery.svg" alt="Gallery" /> Import from gallery
          </button>
          <button class="qr-btn camera" id="scanCamera">
            <img src="icon-camera.svg" alt="Camera" /> Scan with camera
          </button>
        </div>

        <div id="qr-preview"></div>
        <div id="result"></div>
      </section>
    </main>

    <footer>
      <p class="notranslate" translate="no">You do. We validate.</p>
      <p>© 2025 UDoChain — All rights reserved.</p>
    </footer>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="verify.js"></script>
  </body>
</html>
