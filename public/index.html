<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UDoChain Verify</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-left">
        <img src="logo-udochain.png" alt="UDoChain Logo" class="logo" />
        <h1>UDoChain Verify</h1>
      </div>
      <a href="https://wapp.udochain.com" class="nav-link">Dashboard</a>
    </header>

    <main class="container">
      <h2>Verify Blockchain Evidence</h2>
      <p class="subtitle">Scan a QR, upload an image, or enter a transaction hash.</p>

      <section class="qr-section">
        <button id="scanQR" class="btn-primary">Scan QR</button>
        <label for="qrUpload" class="btn-secondary">Upload QR Image</label>
        <input type="file" id="qrUpload" accept="image/*" style="display:none" />

        <!-- Cámara visible -->
        <video id="qrVideo" autoplay playsinline muted></video>
        <canvas id="qrCanvas" style="display:none"></canvas>
      </section>

      <section class="manual-section">
        <input type="text" id="hashInput" placeholder="Or paste a file hash here" />
        <button id="verifyBtn" class="btn-primary">Verify Evidence</button>
      </section>

      <div id="status" class="status"></div>
    </main>

    <footer class="footer">
      <p class="notranslate">You do. We validate.</p>
      <p>© 2025 UDoChain — All rights reserved.</p>
    </footer>

    <script type="module" src="verify.js"></script>
  </body>
</html>
