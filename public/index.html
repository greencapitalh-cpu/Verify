<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UDoChain Verify</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-left">
        <img src="logo-udochain.png" alt="UDoChain" class="logo" />
        <h1>UDoChain Verify</h1>
      </div>
      <a href="https://wapp.udochain.com" class="nav-link">Dashboard</a>
    </header>

    <main class="container">
      <h2 class="title">Verify Blockchain Evidence</h2>
      <p class="subtitle">Scan a QR code or enter a transaction hash.</p>

      <section class="scanner">
        <button id="scanQR" class="btn-primary">📷 Scan QR</button>
        <label for="qrUpload" class="btn-secondary">Upload QR Image</label>
        <input type="file" id="qrUpload" accept="image/*" hidden />
        <video id="qrVideo" autoplay playsinline></video>
      </section>

      <section class="manual">
        <input type="text" id="hashInput" placeholder="Enter transaction hash" />
        <button id="verifyBtn" class="btn-primary">Verify</button>
      </section>

      <div id="status" class="status"></div>
    </main>

    <footer class="footer">
      <p class="notranslate">You do. We validate.</p>
      <p>© 2025 UDoChain — All rights reserved.</p>
    </footer>

    <script type="module" src="verify.js"></script>
    <script src="script-translate.js"></script>
  </body>
</html>
