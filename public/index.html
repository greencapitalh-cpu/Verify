<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UDoChain Verify</title>
  <link rel="icon" href="logo-udochain.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <img src="logo-udochain.png" alt="UDoChain Logo" class="logo" />
    <h1 class="title notranslate" translate="no">UDoChain Verify</h1>
  </header>

  <main class="container">
    <h2>Verify Blockchain Evidence</h2>
    <p class="subtitle">Scan a QR, upload a file, or enter a transaction hash.</p>

    <div class="buttons">
      <button id="scanBtn" class="btn-primary">Scan QR</button>
      <input type="file" id="fileInput" />
      <input type="text" id="hashInput" placeholder="Or paste hash here" />
      <button id="verifyBtn" class="btn-primary">Verify</button>
    </div>

    <div id="status" class="status"></div>
  </main>

  <footer class="footer">
    <p class="notranslate" translate="no">You do. We validate.</p>
    <p>© 2025 UDoChain</p>
  </footer>

  <script src="verify.js"></script>
</body>
</html>
