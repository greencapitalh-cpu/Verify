<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UDoChain Verify — Check Authenticity</title>
    <link rel="icon" href="logo-udochain.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 🔹 Header -->
    <header class="header">
      <div class="header-left">
        <img src="logo-udochain.png" class="logo" alt="UDoChain" />
        <h2 class="notranslate" translate="no">UDoChain Verify</h2>
      </div>
      <nav>
        <a href="https://wapp.udochain.com" class="nav-link">← Back to Wapp</a>
      </nav>
    </header>

    <!-- 🔹 Main Container -->
    <main class="container">
      <h2>Verify a Document</h2>
      <p class="subtitle">
        Upload a file, paste a hash, or scan a QR to verify authenticity.
      </p>

      <!-- Input options -->
      <div class="options">
        <div class="drop-zone" id="dropZone">
          <p>📂 Drop your file here or click to upload</p>
          <input type="file" id="fileInput" accept=".pdf,.zip,.txt" hidden />
        </div>

        <div class="toggle">
          <input type="text" id="hashInput" placeholder="Paste or enter hash..." />
          <button class="btn-validate" id="verifyBtn">Verify</button>
        </div>

        <div class="toggle">
          <button class="btn-icon" id="scanQR">📷 Scan QR</button>
        </div>
      </div>

      <!-- Result -->
      <div id="result" class="status"></div>
    </main>

    <!-- 🔹 Footer -->
    <footer class="footer">
      <p class="notranslate" translate="no">You do. We validate.</p>
      <p>© 2025 UDoChain — All rights reserved.</p>
    </footer>

    <script src="verify.js"></script>
  </body>
</html>
